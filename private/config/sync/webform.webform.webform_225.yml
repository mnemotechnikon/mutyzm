      body: |-
        <h2>[webform:title]</h2>
        <h3>Dziękujemy za wysłanie formularza zgłoszeniowego na szkolenie.</h3>
        <p>Prosimy sprawdzić, czy nie ma błędu w Państwa formularzu zgłoszeniowym.<br />
        Po zebraniu grupy potwierdzimy realizację szkolenia, 10-14 dni przed szkoleniem wysyłamy wiadomość do wszystkich uczestników.  <br />
        Dopiero wtedy wyślemy Państwu e-mailem dane do przelewu oraz dostęp do szkolenia on-line (na żywo) na platformie ZOOM. <br />
        W przypadku faktur na placówki publiczne, FV standardowo wystawiane są w dniu szkolenia z 14 dniowym terminem płatności. <br />
        Bardzo prosimy Państwa o wyrozumiałość i cierpliwość ze względu na bardzo duże zainteresowanie naszymi wydarzeniami on-line.</p>

        <p>Kontakt:<br />
        zapisy@mutyzm.pl<br />
        tel. 796-688-996<br /></p>

        <h3>Przesłane zgłoszenie:</h3>
