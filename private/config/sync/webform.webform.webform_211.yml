  informacja_o_administratorze_danych:
    '#type': processed_text
    '#format': full_html
    '#text': |
      <p><span id='ado_info_teaser'>Administratorem Państwa danych osobowych jest CTM Sp. z o.o. z siedzibą przy ul. Fatimskiej 41a/310 w Krakowie, e-mail: <a href='mailto:biuro@mutyzm.pl'>biuro@mutyzm.pl</a>, tel. 796-688-996.</span><a id='ado_info_more'>pokaż pełny tekst</a><span id='ado_info_full'>Podanie danych osobowych zawartych w formularzu jest dobrowolne, ale niezbędne do odpowiedzi na formularz/realizacji umowy, a także że przysługują Państwu prawa dostępu do Państwa danych osobowych, ich zmiany (w tym aktualizacji), a także pozostałe prawa opisane w <a href='/Polityka_prywatności'>Polityce prywatności</a> art. 6 pkt 1 lit. b,c,f RODO.</span></p>
    '#title': 'Informacja o Administratorze Danych'
  actions:
    '#type': webform_actions
    '#title': 'Submit button(s)'
    '#submit__label': Wyślij
