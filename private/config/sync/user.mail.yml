status_activated:
  subject: '[CTM] - Twoje konto zostało aktywowane'
  body: "<h3>\r\n\tInformacje dotyczące konta [user:name] w witrynie [site:name]:</h3>\r\n<p>Twoje konto zostało aktywowane. Można się teraz do niego zalogować, wprowadzając na stronie [site:login-url] swoje dane.</p>\r\n<p>Logowanie może także zostać przeprowadzone poprzez <u>jednorazowe</u> odwiedzenie strony. [user:one-time-login-url]</p>\r\n<p>Strona [user:edit-url] umożliwia zmianę Twojego hasła.</p>\r\n<p>W razie problem&oacute;w <a href=\"https://mutyzm.pl/Kontakt\">skontaktuj się z administratorem.</a></p>\r\n"
