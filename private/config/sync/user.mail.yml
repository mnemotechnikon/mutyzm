  body: "<h3>Informacje dotyczące konta [user:name] w witrynie [site:name]:</h3>\r\n<p>Twoje konto zostało zablokowane.</p>\r\n<p>W celu wyjaśnienia sytuacji / odblokowania konta <a href=\"https://mutyzm.pl/Kontakt\">skontaktuj się z administratorem.</a></p>"
